on: [push, pull_request]
name: Tests

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.5]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Test
        run: task test

      - name: Integration test
        run: task integration-test

      - name: Lint documentation annotations
        run: task lint-docs

      - name: Check generated example
        run: task check-example
