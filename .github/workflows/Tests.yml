on: [push, pull_request]
name: Tests

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.10]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Test
        run: task test

      - name: Integration test
        run: task integration-test

      - name: Lint documentation annotations
        run: task lint-docs

      - name: Check generated example
        run: task check-example

      - name: Build and check documentation site
        run: task site

      - name: Install Node for reader tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test reader and API enhancements
        run: node --test testdata/ui.test.cjs testdata/api-client.test.cjs testdata/api-client-http.test.cjs testdata/api-client-settings.test.cjs

      - name: Install admin editor dependencies
        run: npm ci --prefix internal/studio/web

      - name: Check embedded editor assets
        run: npm --prefix internal/studio/web run check

      - name: Test admin editor
        run: npm --prefix internal/studio/web test

      - name: Audit admin editor dependencies
        run: npm --prefix internal/studio/web run security

      - name: Verify Docker CMS and offline backups
        run: task docker:test
