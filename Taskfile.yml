version: '3'

vars:
  GOBIN:
    sh: 'echo $(go env GOPATH)/bin'
  GOLANGCI_LINT_VERSION: v2.12.2
  GO_TEST_COVERAGE_VERSION: v2.18.9
  GOVULNCHECK_VERSION: v1.6.0
  GOSEC_VERSION: v2.28.0
  ACTIONLINT_VERSION: v1.7.12

tasks:
  build:
    desc: "Build the standalone binary into build/"
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/pb-md5-generator ./cmd/pb-md5-generator
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - build/pb-md5-generator

  verify:
    desc: "Run local CI checks"
    deps:
      - test
      - check
      - check-coverage
      - security
      - actionlint

  test:
    desc: "Testing all submodules"
    cmds:
      - echo "Testing all submodules..."
      - go test -race ./...
    sources:
      - "**/*.go"

  integration-test:
    desc: "Testing all submodules with integration tests"
    cmds:
      - echo "Testing all submodules..."
      - go test -race ./... -tags=integration_test
    sources:
      - "**/*.go"

  generate-example:
    desc: "Generate EXAMPLE.md from the full integration fixture"
    cmds:
      - |
        prefix="$(mktemp)"
        trap 'rm -f "$prefix"' EXIT
        printf '%s\n' \
          '# Example Output' \
          '' \
          'This file is a generated markdown example for the larger integration fixture: `testdata/integration/full_api.proto`.' \
          '' \
          'It demonstrates the renderer output for annotated protobuf definitions, including generated and explicit code examples, nested messages, maps, repeated fields, enums, oneof payloads, and ignored definitions.' \
          '' \
          '```console' \
          './build/pb-md5-generator -d testdata/integration -f testdata/integration/full_api.proto -o EXAMPLE.md' \
          '```' \
          '' > "$prefix"
        go run ./cmd/pb-md5-generator \
          -d testdata/integration \
          -f testdata/integration/full_api.proto \
          -o EXAMPLE.md \
          -p "$prefix" \
          -style-table-identifiers "{{.STYLE_TABLE | default "bold-code"}}" \
          -style-heading-identifiers "{{.STYLE_HEADING | default "code"}}"
    sources:
      - "testdata/integration/full_api.proto"
      - "**/*.go"
    generates:
      - "EXAMPLE.md"

  check:
    desc: "Running golangci-lint"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run
    sources:
      - "**/*.go"

  check-coverage:
    desc: "Checking test coverage"
    cmds:
      - go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...
      - go run github.com/vladopajic/go-test-coverage/v2@{{.GO_TEST_COVERAGE_VERSION}} --config=./testcoverage.yml
      - rm -f ./cover.out
    sources:
      - "**/*.go"
      - "testcoverage.yml"

  security:
    desc: "Running vulnerability and security checks"
    cmds:
      - go mod verify
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...
      - go run github.com/securego/gosec/v2/cmd/gosec@{{.GOSEC_VERSION}} -exclude=G103,G115,G304 ./...
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  actionlint:
    desc: "Checking GitHub Actions workflows"
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
    sources:
      - ".github/workflows/*.yml"
