version: '3'

vars:
  GOBIN:
    sh: 'echo $(go env GOPATH)/bin'
  GOLANGCI_LINT_VERSION: v2.12.2
  GO_TEST_COVERAGE_VERSION: v2.18.9
  GOVULNCHECK_VERSION: v1.6.0
  GOSEC_VERSION: v2.28.0
  ACTIONLINT_VERSION: v1.7.12
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

tasks:
  docker:up:
    aliases: [cms:up]
    desc: "Build and start the documentation CMS"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose up --build -d --wait

  docker:down:
    aliases: [cms:down]
    desc: "Stop Compose services and keep persistent data"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose --profile static --profile maintenance down

  cms:bootstrap:
    desc: "Create the first administrator from an exact password on stdin"
    dir: '{{.ROOT_DIR}}'
    interactive: true
    requires:
      vars: [CMS_USERNAME]
    env:
      CMS_USERNAME: '{{.CMS_USERNAME}}'
    cmds:
      - docker compose run --rm -T cms admin-user --username "$CMS_USERNAME" --password-stdin

  cms:serve:
    desc: "Run the native CMS binary"
    dir: '{{.ROOT_DIR}}'
    deps: [build]
    cmds:
      - ./build/pb-md5-generator serve {{.CLI_ARGS}}

  cms:backup:
    desc: "Stop the CMS, archive all data privately, and restart it"
    dir: '{{.ROOT_DIR}}'
    env:
      CMS_BACKUP_FILE: '{{.CMS_BACKUP_FILE | default ""}}'
    cmds:
      - docker compose stop cms
      - docker compose --profile maintenance run --rm --no-deps backup
      - docker compose up -d --wait cms

  cms:restore:
    desc: "Restore an archive into a new empty data volume and start the CMS"
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [CMS_DATA_VOLUME, CMS_BACKUP_FILE]
    env:
      CMS_DATA_VOLUME: '{{.CMS_DATA_VOLUME}}'
      CMS_BACKUP_FILE: '{{.CMS_BACKUP_FILE}}'
    cmds:
      - docker compose stop cms
      - docker compose --profile maintenance run --rm --no-deps restore
      - docker compose up -d --wait cms

  docker:check:
    desc: "Validate Dockerfile and maintenance shell scripts"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker buildx build --check --target cms .
      - docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,source={{.ROOT_DIR}}/deploy,target=/scripts,readonly" {{.SHELLCHECK_IMAGE}} /scripts/cms-entrypoint.sh /scripts/cms-healthcheck.sh /scripts/cms-archive.sh

  docker:test:
    desc: "Verify CMS login, Git publication, persistence and backup/restore in an isolated Compose project"
    dir: '{{.ROOT_DIR}}'
    deps: [docker:check]
    cmds:
      - python3 testdata/docker-cms.test.py

  docker:static:
    desc: "Build and start the static example on localhost:8081"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose --profile static up --build -d --wait docs

  build:
    desc: "Build the standalone binary into build/"
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/pb-md5-generator ./cmd/pb-md5-generator
    sources:
      - "**/*.go"
      - "internal/site/*.js"
      - "internal/studio/web/assets/*"
      - "internal/studio/web/package*.json"
      - "internal/studio/web/build.mjs"
      - "internal/studio/api/*.yaml"
      - "document/**/*.json"
      - go.mod
      - go.sum
    generates:
      - build/pb-md5-generator

  verify:
    desc: "Run local CI checks"
    deps:
      - test
      - check
      - check-coverage
      - lint-docs
      - check-example
      - security
      - actionlint
      - test-ui

  test-ui:
    desc: "Check reader, API panel and embedded admin editor without a browser"
    deps: [site]
    cmds:
      - node --test testdata/ui.test.cjs testdata/api-client.test.cjs testdata/api-client-http.test.cjs testdata/api-client-settings.test.cjs
      - npm ci --prefix internal/studio/web
      - npm --prefix internal/studio/web run check
      - npm --prefix internal/studio/web test
      - npm --prefix internal/studio/web run security

  site:
    desc: "Build and verify the mixed documentation site"
    deps: [build]
    cmds:
      - ./build/pb-md5-generator build -config docs.json -o site
      - ./build/pb-md5-generator build -config docs.json -o site -check

  benchmark:
    desc: "Measure Markdown compilation time and allocations"
    cmds:
      - go test ./internal/site -run '^$' -bench BenchmarkCompileMarkdown -benchmem

  test:
    desc: "Testing all submodules"
    cmds:
      - echo "Testing all submodules..."
      - go test -race ./...
    sources:
      - "**/*.go"
      - "internal/site/*.js"
      - "internal/studio/web/assets/*"
      - "internal/studio/web/package*.json"
      - "internal/studio/web/build.mjs"
      - "internal/studio/api/*.yaml"
      - "document/**/*.json"
      - go.mod
      - go.sum

  integration-test:
    desc: "Testing all submodules with integration tests"
    cmds:
      - echo "Testing all submodules..."
      - go test -race ./... -tags=integration_test
    sources:
      - "**/*.go"
      - "internal/site/*.js"
      - "internal/studio/web/assets/*"
      - "internal/studio/web/package*.json"
      - "internal/studio/web/build.mjs"
      - "internal/studio/api/*.yaml"
      - "document/**/*.json"
      - go.mod
      - go.sum

  lint-docs:
    desc: "Validate documentation annotations in the integration fixture"
    cmds:
      - go run ./cmd/pb-md5-generator lint -d testdata/integration -f testdata/integration/full_api.proto
    sources:
      - "testdata/integration/full_api.proto"
      - "**/*.go"

  generate-example:
    desc: "Generate EXAMPLE.md from the full integration fixture"
    cmds:
      - |
        go run ./cmd/pb-md5-generator generate \
          -d testdata/integration \
          -f testdata/integration/full_api.proto \
          -o EXAMPLE.md \
          -p testdata/integration/example_prefix.md \
          -seed 1 \
          -style-table-identifiers "{{.STYLE_TABLE | default "bold-code"}}" \
          -style-heading-identifiers "{{.STYLE_HEADING | default "code"}}"
    sources:
      - "testdata/integration/full_api.proto"
      - "testdata/integration/example_prefix.md"
      - "**/*.go"
    generates:
      - "EXAMPLE.md"

  check-example:
    desc: "Verify that EXAMPLE.md is current"
    cmds:
      - |
        go run ./cmd/pb-md5-generator generate \
          -d testdata/integration \
          -f testdata/integration/full_api.proto \
          -o EXAMPLE.md \
          -p testdata/integration/example_prefix.md \
          -seed 1 \
          -check \
          -style-table-identifiers "{{.STYLE_TABLE | default "bold-code"}}" \
          -style-heading-identifiers "{{.STYLE_HEADING | default "code"}}"
    sources:
      - "EXAMPLE.md"
      - "testdata/integration/full_api.proto"
      - "testdata/integration/example_prefix.md"
      - "**/*.go"

  check:
    desc: "Running golangci-lint"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run
    sources:
      - "**/*.go"

  check-coverage:
    desc: "Checking test coverage"
    cmds:
      - go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...
      - go run github.com/vladopajic/go-test-coverage/v2@{{.GO_TEST_COVERAGE_VERSION}} --config=./testcoverage.yml
      - rm -f ./cover.out
    sources:
      - "**/*.go"
      - "internal/site/*.js"
      - "internal/studio/web/assets/*"
      - "internal/studio/web/package*.json"
      - "internal/studio/web/build.mjs"
      - "internal/studio/api/*.yaml"
      - "document/**/*.json"
      - go.mod
      - go.sum
      - "testcoverage.yml"

  security:
    desc: "Running vulnerability and security checks"
    cmds:
      - go mod verify
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...
      - go run github.com/securego/gosec/v2/cmd/gosec@{{.GOSEC_VERSION}} -exclude=G103,G115,G304 ./...
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  actionlint:
    desc: "Checking GitHub Actions workflows"
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
    sources:
      - ".github/workflows/*.yml"
