openapi: 3.1.0
info:
  title: PB Docs CMS API
  version: 0.1.0
  description: |
    API for the self-hosted documentation CMS. The static compiler
    remains independently deployable. CMS routes require a session unless an
    operation explicitly declares otherwise. Unsafe authenticated requests also
    require X-CSRF-Token from the current session response and a matching Origin
    header on every unsafe request, including login. The request Host must match
    the configured public URL. Responses containing user or document data are
    not publicly cacheable. Automatic publication settings apply to document
    saves and file changes; document registration, manual rebase, history restore
    and recursive folder deletion remain drafts until explicitly published.
    String limits also enforce the documented UTF-8 byte limits. This contract
    and HTTP tests do not establish browser usability.
servers:
  - url: ./
    description: API root relative to the authenticated openapi.yaml URL, including any deployment prefix
security:
  - sessionCookie: []
  - developmentSessionCookie: []
tags:
  - name: Session
  - name: Users
  - name: Documents
  - name: Files
  - name: Publishing
  - name: Storage
  - name: Settings
paths:
  /openapi.yaml:
    get:
      operationId: getAPIContract
      tags: [Settings]
      summary: Download this complete API contract after signing in
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Self-contained OpenAPI YAML; conditional and range headers are ignored
          content:
            application/yaml:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /session:
    get:
      operationId: getSession
      tags: [Session]
      security: []
      summary: Read the current session without creating one
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Current user and CSRF token, or a null user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
    post:
      operationId: login
      parameters: [{$ref: '#/components/parameters/Origin'}]
      tags: [Session]
      security: []
      summary: Sign in and rotate the session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 64}
                password: {$ref: '#/components/schemas/Password'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Signed-in session; cookie is HttpOnly, host-only and SameSite Strict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/Limited'}
    delete:
      operationId: logout
      tags: [Session]
      summary: Revoke the current session and expire its cookie
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '204': {description: Session revoked}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users; administrators only
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Users without password hashes or session material
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/User'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user; administrators only
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '201':
          description: Created user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Change a user and revoke affected sessions; administrators only
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user without removing the final active administrator
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '204': {description: User removed and sessions revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List readable documents and the current project revision
      parameters:
        - in: query
          name: published
          description: Return only published page metadata without reading or merging saved drafts; useful for stable navigation page IDs
          schema: {type: boolean, default: false}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Documents filtered by the current user's permissions
          content:
            application/json:
              schema:
                type: object
                required: [documents, revision]
                properties:
                  documents: {type: array, maxItems: 2048, items: {$ref: '#/components/schemas/Document'}}
                  revision: {$ref: '#/components/schemas/Revision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createDocument
      tags: [Documents]
      summary: Create a document draft at an authorized source path
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentCreate'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '201':
          description: Created document and saved draft, or automatic publication result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /documents/register:
    post:
      operationId: registerExistingSource
      tags: [Documents]
      summary: Register reviewed live source as a new document draft
      description: |
        The JSON body is at most 32 KiB and contains metadata only. First read
        the live file through GET /files/content without draftId. Send its quoted
        ETag value without quotes as revision, and X-Source-Revision as
        sourceRevision. The latter binds the exact downloaded bytes to this
        request. Fresh read and write access, current project and source hashes,
        branch, page identity, URL and competing drafts are checked under one
        content gate. The source must be valid UTF-8 without NUL, at most 4 MiB.
        Its bytes, BOM and line endings are preserved. An explicit format is
        required; source extensions do not select or restrict the renderer.
        Publish or discard pending file or restoration drafts first. Existing
        page IDs and registrations are never rebound or inferred from history.
        Collisions return a generic conflict without disclosing private names.
        A new registration always stays in a draft, including with autoPublish.
        Explicit publication validates rendering and preserves unchanged source
        files. Custom navigation must be updated separately when it omits pages.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, revision, sourceRevision, title, kind]
              properties:
                path: {type: string, minLength: 1, maxLength: 2048}
                revision: {$ref: '#/components/schemas/Revision'}
                sourceRevision: {$ref: '#/components/schemas/Revision'}
                title: {type: string, minLength: 1, maxLength: 256, description: At most 256 UTF-8 bytes without control characters}
                kind: {type: string, enum: [markdown, html, protobuf, openapi]}
                id: {type: string, maxLength: 128, pattern: '^$|^[a-z0-9][a-z0-9._-]{0,127}$', description: Optional new permanent page ID; an empty value generates one}
                outputPath: {type: string, maxLength: 4096, description: Optional safe lowercase ASCII relative .html path; defaults to the lowercased source stem plus .html}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '201':
          description: New document and registration draft; publication remains explicit
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SaveResult'}
                  - type: object
                    required: [document, draft, revision, published]
                    properties:
                      published: {const: false}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Failure'}
  /documents/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Read source and the current user's draft when one exists
      parameters:
        - in: query
          name: published
          description: Bypass the actor's draft to compare against the current published source
          schema: {type: boolean, default: false}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Editable source with opaque revision identifiers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
    put:
      operationId: saveDocument
      tags: [Documents]
      summary: Save source and optional document properties as one draft
      description: |
        A stale revision never overwrites newer content. Omitted properties keep
        the saved draft's title, format and page URL. When supplied, properties
        is a complete triple and propertiesRevision must match the reviewed
        current project revision, separate from an existing draft's older base.
        The source path and permanent document ID cannot change here. Fresh
        permissions, branch, draft ownership, page URL collisions and the home
        page URL are checked under one content gate. A failed publication keeps
        both source and properties in the draft and preserves the last site.
        Changed URLs do not create redirects or rewrite links. A failed Git
        push preserves the local commit and reports pending synchronization.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentSave'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Saved content and explicit publication/synchronization state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/InvalidContent'}
    delete:
      operationId: deleteDocument
      tags: [Documents]
      summary: Stage document removal without bypassing revision checks
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Removal draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /documents/{id}/rebase:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: rebaseDocumentDraft
      tags: [Documents]
      summary: Save an explicitly reviewed merge against the latest project revision
      description: |
        This operation never publishes. When an owned draft exists, draftId and
        draftRevision must identify its current version. Review both the source
        and properties against the latest published document before sending a
        merged result. Supplied properties are the explicitly chosen complete
        triple; propertiesRevision must equal the reviewed current revision.
        Omitting properties preserves the owned draft's values, or the current
        published values when no draft exists. A stale project or draft revision
        returns 409 and preserves the previously saved draft.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentRebase'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Rebased draft with fresh draft revision and reviewed base revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /documents/{id}/move:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: moveDocument
      tags: [Documents]
      summary: Stage a document move while preserving its identity
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Move'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Move draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /documents/{id}/history:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: documentHistory
      tags: [Documents]
      summary: Read document revision history
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Bounded newest-first revision history
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/HistoryEntry'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
  /documents/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreDocument
      tags: [Documents]
      summary: Restore a historical revision into a new draft
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [historyId, revision]
              properties:
                historyId: {type: string, minLength: 1, maxLength: 256}
                revision: {$ref: '#/components/schemas/Revision'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Restored draft; publication remains explicit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /drafts:
    get:
      operationId: listDrafts
      tags: [Publishing]
      summary: List the current user's drafts
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Drafts without publishing them
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts: {type: array, items: {$ref: '#/components/schemas/Draft'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /drafts/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: discardDraft
      tags: [Publishing]
      summary: Discard an owned draft at its expected revision
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '204': {description: Draft discarded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /drafts/{id}/publish:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: publishDraft
      tags: [Publishing]
      summary: Validate and publish an owned draft, then synchronize if configured
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {$ref: '#/components/schemas/Revision'}
                message: {type: string, maxLength: 256}
                push: {type: boolean, default: false}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Publication result; remote synchronization may remain pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidContent'}
  /preview:
    post:
      operationId: previewDocument
      tags: [Documents]
      summary: Render unsaved source without publishing or executing it
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentId, content]
              properties:
                documentId: {type: string, minLength: 1, maxLength: 256}
                content: {type: string, maxLength: 4194304}
                properties: {$ref: '#/components/schemas/DocumentProperties', description: Optional unsaved title, format and page URL; preview does not save them}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: HTML for a sandboxed preview; no scripts or publication side effects
          content:
            application/json:
              schema:
                type: object
                required: [html, diagnostics]
                properties:
                  html: {type: string, maxLength: 16777216, description: At most 16 MiB of raw UTF-8 HTML and 16 MiB of JSON-escaped string content; larger previews return 413}
                  diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/InvalidContent'}
  /files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List permitted content files and folders
      parameters:
        - in: query
          name: path
          description: Folder to list; defaults to the content root
          schema: {type: string, minLength: 1, maxLength: 2048, default: '.'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Managed content tree, excluding internal state and Git metadata
          content:
            application/json:
              schema:
                type: object
                required: [files, revision]
                properties:
                  files: {type: array, items: {$ref: '#/components/schemas/FileEntry'}}
                  revision: {$ref: '#/components/schemas/Revision'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createFolder
      tags: [Files]
      summary: Stage creation of a content folder
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, revision]
              properties:
                path: {type: string, minLength: 1, maxLength: 2048}
                revision: {$ref: '#/components/schemas/Revision'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '201':
          description: Folder draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/history:
    parameters: [{$ref: '#/components/parameters/Path'}]
    get:
      operationId: sourceFileHistory
      tags: [Files]
      summary: Read permitted history for one exact source path, including a deleted file
      description: |
        Read access to the requested source path is required. The metadata and
        current project revision come from one serialized view. Only the current
        branch's exact path is selected; document IDs never follow moves into
        other paths. No payload bytes, branch names, account IDs or emails are
        returned. Tombstones are visible but cannot be restored. Restorable
        indicates permission and metadata eligibility, not payload availability.
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Bounded newest-first source history and its project revision
          headers:
            ETag: {schema: {type: string}, description: Quoted current project revision}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceHistory'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
  /files/rebase:
    parameters: [{$ref: '#/components/parameters/Path'}]
    post:
      operationId: rebaseSourceFileDraft
      tags: [Files]
      summary: Save an explicitly reviewed source merge as an unpublished draft
      description: |
        Editors need fresh read and write access to this exact source path.
        If-Match must be the latest project revision the caller reviewed.
        X-Draft-ID and X-Draft-Revision are optional together. When supplied,
        they update only that owned single-write draft on its current branch.
        When absent, a new draft is created without selecting another draft.
        A competing current-branch path or move destination returns a generic
        conflict. Project and draft revisions, branch, permission and persistence
        are checked under one content gate. Source is valid UTF-8 without NUL,
        at most 4 MiB; empty text, BOM and line endings are preserved.
        This operation never publishes, including when autoPublish is enabled.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/IfMatch'}
        - in: header
          name: X-Draft-ID
          description: Optional owned draft ID; requires X-Draft-Revision
          schema: {type: string, pattern: '^[0-9a-f]{32}$', minLength: 32, maxLength: 32}
        - in: header
          name: X-Draft-Revision
          description: Expected owned draft revision; requires X-Draft-ID
          schema: {$ref: '#/components/schemas/Revision'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 4194304}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Reviewed merged draft, retaining the supplied owned ID when present
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceDraftResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /files/restore:
    post:
      operationId: restoreSourceFile
      tags: [Files]
      summary: Restore retained historical file bytes into a new unpublished draft
      description: |
        The JSON body is at most 32 KiB. Fresh read and write grants, current
        project revision, exact historical path and branch, and the bounded
        retained payload are checked inside one content gate. Tombstones are not
        restorable. The request never overwrites an existing draft or publishes.
        Historical document metadata is ignored: current page registration stays
        in place and a deleted page is restored only as an unregistered source
        file. Page IDs, titles, kinds, output paths and navigation are not reset.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceRestore'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: New source draft; publication remains explicit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceDraftResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /files/delete-preview:
    post:
      operationId: previewFolderDeletion
      tags: [Files]
      summary: Review a fully authorized recursive folder deletion without changing content
      description: |
        Editors need fresh read and write access to the target and every entry.
        A denied or unsafe subtree returns no inventory or counts. The plan is
        bound to the actor, project revision, branch and complete inventory.
        Limits are 1024 entries, 127 regular files and 64 MiB of deleted bytes.
        Only the first 100 authorized entries are displayed; counts cover the
        complete subtree. Overlapping current-branch drafts cause a generic
        conflict and remain intact. Root, homepage and unmanaged content are
        protected. This operation does not save a draft or publish anything.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteTreeInput'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Authorized bounded deletion plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteTreePlan'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /files/delete-tree:
    post:
      operationId: stageFolderDeletion
      tags: [Files]
      summary: Save a reviewed folder deletion as one owned draft
      description: |
        The server recomputes the authorized plan under the content gate.
        A stale project or plan revision, new overlapping draft, changed branch
        or lost permission prevents staging. This operation always returns an
        unpublished draft, including when autoPublish is enabled. Publish it
        explicitly through the existing draft publication operation, which
        rechecks the plan and permissions. Other drafts are never discarded.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteTreeStage'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Folder deletion draft; published is always false
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SaveResult'}
                  - type: object
                    required: [draft]
                    properties:
                      published: {type: boolean, const: false}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /files/content:
    parameters: [{$ref: '#/components/parameters/Path'}]
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download an authorized content file or the caller's matching text draft
      description: |
        Published files require read access. An optional draftId selects only
        the caller's single-write UTF-8 draft for this exact path and requires
        fresh read and write access. Foreign or mismatched drafts return 404.
        Files remain downloads with attachment, sandbox and nosniff protection.
      parameters:
        - in: query
          name: draftId
          description: Optional owned single-write text draft ID; no cross-branch draft selection
          schema: {type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Original bytes; active file formats are downloads rather than executable pages
          headers:
            ETag: {schema: {type: string}, description: Quoted project revision for published content or quoted draft revision when draftId is supplied}
            X-Base-Revision: {schema: {type: string}, description: Stored project base revision; present only for an owned draft response}
            X-Source-Revision: {schema: {$ref: '#/components/schemas/Revision'}, description: SHA256 of the exact downloaded bytes; present for a live file and required when registering its reviewed contents}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
    put:
      operationId: uploadFile
      tags: [Files]
      summary: Save a bounded file upload as a draft or publish according to settings
      description: |
        Images (PNG, JPEG, GIF, WebP, AVIF, ICO) and PDF are at most 16 MiB.
        Markdown, protobuf, JSON, YAML, HTML, plain text and literal code examples
        (.go, .js, .ts, .sh, .sql, .css, .xml) must be valid UTF-8 without NUL
        and at most 4 MiB. Code examples are not executable pages or assets.
        Other file extensions are rejected. New drafts require the current
        project If-Match revision. To save an existing owned single-write draft,
        X-Draft-ID and X-Draft-Revision must appear together and match its exact
        path and current branch; If-Match must equal its stored base revision.
        Saving preserves that base even if the project advanced. No automatic
        rebase occurs. A publication conflict retains the successfully saved
        draft and returns its metadata in the error response.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/IfMatch'}
        - in: header
          name: X-Draft-ID
          description: Owned single-write draft ID; requires X-Draft-Revision
          schema: {type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$'}
        - in: header
          name: X-Draft-Revision
          description: Expected draft revision; requires X-Draft-ID
          schema: {$ref: '#/components/schemas/Revision'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 16777216}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Upload saved as a draft or published according to site settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Stage removal of a file or empty folder
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Removal draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/move:
    post:
      operationId: moveFile
      tags: [Files]
      summary: Move between authorized paths, saving a draft or publishing as configured
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileMove'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Move draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /branches:
    get:
      operationId: listBranches
      tags: [Storage]
      summary: List branches of the managed repository; administrators only
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Available branches
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches: {type: array, items: {$ref: '#/components/schemas/Branch'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createBranch
      tags: [Storage]
      summary: Create a branch; administrators only
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, revision]
              properties:
                name: {type: string, minLength: 1, maxLength: 128, description: At most 128 UTF-8 bytes and a valid Git branch name}
                revision: {$ref: '#/components/schemas/Revision'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Branch created and current synchronization state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /branches/checkout:
    post:
      operationId: checkoutBranch
      tags: [Storage]
      summary: Select a clean managed branch without discarding edits or drafts
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, revision]
              properties:
                name: {type: string, minLength: 1, maxLength: 128, description: At most 128 UTF-8 bytes and a valid Git branch name}
                revision: {$ref: '#/components/schemas/Revision'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: New branch and project state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sync/status:
    get:
      operationId: synchronizationStatus
      tags: [Storage]
      summary: Read local synchronization state; branch and commit details are administrators only
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Status from local repository state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /sync:
    post:
      operationId: synchronize
      tags: [Storage]
      summary: Explicitly fetch, pull or push the configured managed repository
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, revision]
              properties:
                action: {type: string, enum: [fetch, pull, push]}
                revision: {$ref: '#/components/schemas/Revision'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Synchronization result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /storage/configuration:
    get:
      operationId: getStorageConfiguration
      tags: [Storage]
      summary: Read managed storage settings and cached connection states; administrators with root access only
      description: This operation does not contact a remote repository. Connection URLs never contain passwords; SSH credentials stay in the private server volume.
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Consistent settings, project revision and cached synchronization state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: configureStorage
      tags: [Storage]
      summary: Enroll local content into Git or update named connections; administrators with root access only
      description: |
        Both storage settings and project revisions must match. Enrollment creates
        one local Git history without fetching or pushing. Source, published output,
        local history and saved drafts are retained. Existing drafts become stale
        and require an explicit reviewed rebase. Returning from Git to local storage
        is unsupported. One connection supplies fetch/pull; multiple connections
        may receive the same local commits. Connection changes never silently
        overwrite documents or resolve divergence.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageUpdate'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Persisted configuration and current local synchronization state; no remote traffic occurred
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /storage/remotes/{name}/check:
    parameters: [{$ref: '#/components/parameters/StorageRemoteName'}]
    post:
      operationId: checkStorageRemote
      tags: [Storage]
      summary: Explicitly check one configured connection; administrators with root access only
      description: |
        Reads remote references without changing source files or publishing.
        A completed attempt returns its explicit state. HTTP 200 with state:error
        reports an unsuccessful connection and includes a safe retryable status.
        Authentication, validation and stale revisions use ordinary error responses.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageRemoteCheck'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Explicit result of the connection attempt; inspect state and retryable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteSyncStatus'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /storage/remotes/{name}/push:
    parameters: [{$ref: '#/components/parameters/StorageRemoteName'}]
    post:
      operationId: pushStorageRemote
      tags: [Storage]
      summary: Explicitly push or retry one configured target; administrators with root access only
      description: |
        Both revisions must match. A target failure retains the local commit and
        does not undo successful pushes to other targets. HTTP 200 alone does not
        establish synchronization: inspect state and retryable. Push never forces
        remote history or changes the selected pull authority.
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageRemotePush'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Explicit result for this target, including a safe retryable failure when needed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteSyncStatus'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Missing'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Read site settings without exposing stored credentials
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Current settings and revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Update settings with revision protection; administrators only
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Updated settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /themes:
    get:
      operationId: listThemes
      tags: [Settings]
      summary: List installed themes
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Themes
          content:
            application/json:
              schema:
                type: object
                required: [themes]
                properties:
                  themes: {type: array, maxItems: 67, items: {$ref: '#/components/schemas/Theme'}}
    post:
      operationId: saveTheme
      tags: [Settings]
      summary: Install or update a declarative theme; administrators only
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ThemeInput'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Stored theme
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Theme'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /themes/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: deleteTheme
      tags: [Settings]
      summary: Remove an unused custom theme; administrators only
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/ThemeIfMatch'}
      responses:
        default: {$ref: '#/components/responses/Failure'}
        '200':
          description: Theme removed locally; requested Git push needs attention
          content:
            application/json:
              schema:
                type: object
                required: [sync]
                properties:
                  sync: {$ref: '#/components/schemas/SyncWarning'}
        '204': {description: Theme removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-docs_session
      description: HTTPS host-only session cookie; HttpOnly, Secure, SameSite Strict, Path=/
    developmentSessionCookie:
      type: apiKey
      in: cookie
      name: docs_session
      description: HTTP on the literal localhost hostname only; Secure, HttpOnly, host-only, SameSite Strict, Path=/. Other hosts, including numeric loopback addresses, require HTTPS.
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    StorageRemoteName:
      in: path
      name: name
      required: true
      description: Configured connection name; case-folding duplicates and reserved Windows device names are rejected
      schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
    Path:
      in: query
      name: path
      required: true
      description: Clean project-relative path using forward slashes; internal and escaping paths are forbidden
      schema: {type: string, minLength: 1, maxLength: 2048}
    Origin:
      in: header
      name: Origin
      required: true
      description: Exact configured public origin without a path, for example https://docs.example
      schema: {type: string, minLength: 1, maxLength: 4096}
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Token returned by GET or POST session; never put it in a URL
      schema: {type: string, minLength: 1, maxLength: 256}
    ThemeIfMatch:
      in: header
      name: If-Match
      required: true
      description: Current global project revision quoted as an HTTP entity tag
      schema: {type: string, minLength: 66, maxLength: 66, pattern: '^"[0-9a-f]{64}"$'}
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Expected project or draft revision, preferably quoted as an HTTP entity tag; theme deletion requires quotes
      schema: {type: string, minLength: 64, maxLength: 66, pattern: '^(?:[0-9a-f]{64}|"[0-9a-f]{64}")$'}
  schemas:
    Revision:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      description: Opaque project or draft revision; clients preserve all 64 lowercase hexadecimal characters exactly
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 10
      maxLength: 1024
      description: At least 10 Unicode characters and at most 1024 UTF-8 bytes; no trimming or silent truncation
    Role:
      type: string
      enum: [admin, editor, viewer]
    Grants:
      type: object
      additionalProperties: false
      properties:
        read: {type: array, maxItems: 32, items: {type: string, maxLength: 256, description: At most 256 UTF-8 bytes}}
        write: {type: array, maxItems: 32, items: {type: string, maxLength: 256, description: At most 256 UTF-8 bytes}}
      description: Optional allowlists of clean source-path prefixes, restricted by the role's capabilities
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, role, disabled]
      properties:
        id: {type: string}
        username: {type: string, maxLength: 64}
        displayName: {type: string, maxLength: 256, description: At most 256 UTF-8 bytes}
        role: {$ref: '#/components/schemas/Role'}
        disabled: {type: boolean}
        grants:
          oneOf:
            - {$ref: '#/components/schemas/Grants'}
            - {type: 'null'}
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        displayName: {type: string, maxLength: 256, description: At most 256 UTF-8 bytes}
        password: {$ref: '#/components/schemas/Password'}
        role: {$ref: '#/components/schemas/Role'}
        grants: {$ref: '#/components/schemas/Grants'}
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, maxLength: 256, description: At most 256 UTF-8 bytes}
        password: {$ref: '#/components/schemas/Password'}
        role: {$ref: '#/components/schemas/Role'}
        disabled: {type: boolean}
        grants:
          oneOf:
            - {$ref: '#/components/schemas/Grants'}
            - {type: 'null'}
    Session:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          oneOf:
            - {$ref: '#/components/schemas/User'}
            - {type: 'null'}
        csrfToken: {type: string}
        setupRequired: {type: boolean}
    Document:
      type: object
      description: Source and properties include the current user's saved write draft unless published=true; publishedRevision identifies the current project separately from an older draft base
      required: [id, path, title, kind, revision]
      properties:
        id: {type: string, readOnly: true, description: Permanent page identity}
        path: {type: string, readOnly: true, description: Managed source path; use the move operation to change it}
        title: {type: string}
        kind: {type: string, enum: [markdown, html, protobuf, openapi]}
        outputPath: {type: string}
        revision: {$ref: '#/components/schemas/Revision'}
        publishedRevision: {type: string}
        content: {type: string, maxLength: 4194304}
        draft: {type: boolean}
        draftId: {type: string}
        draftRevision: {type: string}
        baseRevision: {type: string}
        canWrite: {type: boolean}
    DocumentCreate:
      type: object
      additionalProperties: false
      required: [path, title, kind, content, revision]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        title: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [markdown, html, protobuf, openapi]}
        outputPath: {type: string, maxLength: 2048}
        content: {type: string, maxLength: 4194304}
        revision: {$ref: '#/components/schemas/Revision'}
    DocumentProperties:
      type: object
      additionalProperties: false
      required: [title, kind, outputPath]
      properties:
        title: {type: string, minLength: 1, maxLength: 256, description: At most 256 UTF-8 bytes; nonblank and without control characters}
        kind: {type: string, enum: [markdown, html, protobuf, openapi], description: Explicit renderer; the source extension does not select it}
        outputPath: {type: string, minLength: 1, maxLength: 4096, description: Required safe lowercase ASCII relative .html URL, at most 4096 bytes; the home page must keep index.html}
    DocumentSave:
      type: object
      additionalProperties: false
      required: [content, revision]
      dependentRequired:
        properties: [propertiesRevision]
        propertiesRevision: [properties]
      properties:
        content: {type: string, maxLength: 4194304}
        revision: {$ref: '#/components/schemas/Revision'}
        draftId: {type: string, maxLength: 256}
        draftRevision: {type: string, maxLength: 256}
        baseRevision: {type: string, maxLength: 256}
        publish: {type: boolean, default: false}
        message: {type: string, maxLength: 256}
        properties: {$ref: '#/components/schemas/DocumentProperties'}
        propertiesRevision: {$ref: '#/components/schemas/Revision', description: Reviewed current project revision from publishedRevision; required with properties and distinct from draft baseRevision}
    DocumentRebase:
      type: object
      additionalProperties: false
      required: [content, revision]
      dependentRequired:
        properties: [propertiesRevision]
        propertiesRevision: [properties]
      properties:
        content: {type: string, maxLength: 4194304, description: At most 4 MiB of UTF-8 source}
        revision: {$ref: '#/components/schemas/Revision'}
        draftId: {type: string, maxLength: 256}
        draftRevision: {$ref: '#/components/schemas/Revision'}
        properties: {$ref: '#/components/schemas/DocumentProperties', description: Complete properties explicitly selected after comparing against the latest published document}
        propertiesRevision: {$ref: '#/components/schemas/Revision', description: Reviewed current project revision; must match revision for this explicit rebase}
    Move:
      type: object
      additionalProperties: false
      required: [to, revision]
      properties:
        to: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision'}
    FileMove:
      type: object
      additionalProperties: false
      required: [path, to, revision]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        to: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision'}
    SourceDraftResult:
      allOf:
        - {$ref: '#/components/schemas/SaveResult'}
        - type: object
          required: [draft]
          properties:
            published: {type: boolean, const: false}
    SourceHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, path, revision, author, createdAt, size, deleted, restorable]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        path: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision', description: Historical project revision; not a payload checksum}
        author: {type: string, maxLength: 256, description: Display name only; account IDs and email are omitted}
        createdAt: {type: string, format: date-time}
        size: {type: integer, minimum: 0, maximum: 16777216}
        deleted: {type: boolean}
        restorable: {type: boolean, description: Non-tombstone with current write permission; the retained payload is validated only on restore}
    SourceHistory:
      type: object
      additionalProperties: false
      required: [path, revision, revisions]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision'}
        revisions: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/SourceHistoryEntry'}}
    SourceRestore:
      type: object
      additionalProperties: false
      required: [path, historyId, revision]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        historyId: {type: string, pattern: '^[0-9a-f]{32}$', minLength: 32, maxLength: 32}
        revision: {$ref: '#/components/schemas/Revision'}
    DeleteTreeInput:
      type: object
      additionalProperties: false
      required: [path, revision]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048, description: Clean relative managed folder path; the root is not permitted}
        revision: {$ref: '#/components/schemas/Revision'}
    DeleteTreeStage:
      type: object
      additionalProperties: false
      required: [path, revision, planRevision]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision'}
        planRevision: {$ref: '#/components/schemas/Revision', description: Exact proof from the reviewed deletion plan}
    DeleteTreeEntry:
      type: object
      additionalProperties: false
      required: [path, directory, size]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        directory: {type: boolean}
        size: {type: integer, minimum: 0, maximum: 67108864, description: Regular file bytes; directories have size zero}
    DeleteTreePlan:
      type: object
      additionalProperties: false
      required: [path, revision, planRevision, fileCount, directoryCount, documentCount, totalBytes, entries, truncated]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        revision: {$ref: '#/components/schemas/Revision'}
        planRevision: {$ref: '#/components/schemas/Revision'}
        fileCount: {type: integer, minimum: 0, maximum: 127}
        directoryCount: {type: integer, minimum: 1, maximum: 1024, description: Includes the target folder}
        documentCount: {type: integer, minimum: 0, maximum: 127}
        totalBytes: {type: integer, minimum: 0, maximum: 67108864}
        entries: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DeleteTreeEntry'}}
        truncated: {type: boolean, description: Only the displayed entries are truncated; totals and authorization cover the complete subtree}
    FileEntry:
      type: object
      required: [path, directory, revision]
      properties:
        path: {type: string}
        name: {type: string}
        directory: {type: boolean}
        size: {type: integer, minimum: 0}
        revision: {$ref: '#/components/schemas/Revision'}
        canWrite: {type: boolean}
    Draft:
      type: object
      required: [id, revision, baseRevision, path, operation]
      properties:
        id: {type: string}
        revision: {$ref: '#/components/schemas/Revision'}
        baseRevision: {$ref: '#/components/schemas/Revision'}
        path: {type: string}
        operation: {type: string, enum: [write, delete, delete-tree, move, mkdir, rmdir]}
        title: {type: string}
        updatedAt: {type: string, format: date-time}
    SaveResult:
      type: object
      required: [revision, published]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        published: {type: boolean}
        document: {$ref: '#/components/schemas/Document'}
        draft: {$ref: '#/components/schemas/Draft'}
        commit: {type: string}
        sync: {$ref: '#/components/schemas/SyncStatus'}
    HistoryEntry:
      type: object
      required: [id, path]
      properties:
        id: {type: string}
        path: {type: string}
        revision: {type: string}
        commit: {type: string}
        message: {type: string}
        author: {type: string}
        createdAt: {type: string, format: date-time}
        size: {type: integer, minimum: 0}
    Branch:
      type: object
      required: [name]
      properties:
        name: {type: string}
        current: {type: boolean}
        commit: {type: string}
    SyncStatus:
      type: object
      required: [backend]
      properties:
        backend: {type: string, enum: [local, git]}
        branch: {type: string}
        revision: {type: string}
        dirty: {type: boolean}
        ahead: {type: integer, minimum: 0}
        behind: {type: integer, minimum: 0}
        pendingPush: {type: boolean}
        lastCommit: {type: string}
        lastError: {type: string, maxLength: 1024}
    StorageSyncStatus:
      type: object
      additionalProperties: false
      required: [backend, state, ahead, behind, dirty, retryable]
      properties:
        backend: {type: string, enum: [local, git]}
        branch: {type: string}
        head: {type: string}
        state: {type: string, enum: [local, clean, modified, pending, behind, error]}
        ahead: {type: integer, minimum: 0}
        behind: {type: integer, minimum: 0}
        dirty: {type: boolean}
        retryable: {type: boolean}
        error: {type: string, maxLength: 1024}
    StorageRemote:
      type: object
      additionalProperties: false
      required: [name, url, push]
      properties:
        name: {$ref: '#/components/parameters/StorageRemoteName/schema'}
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: At most 2048 UTF-8 bytes. SSH or local/file transport only, without embedded passwords, query, fragment or control characters. SSH keys and verified known_hosts remain in private server storage.
        push: {type: boolean, description: Include this connection in requested publication pushes; each target keeps its own retry state}
    StorageSettings:
      type: object
      additionalProperties: false
      required: [revision, backend, pullRemote, remotes]
      properties:
        revision: {$ref: '#/components/schemas/Revision', description: Storage settings revision; separate from the project revision}
        backend: {type: string, enum: [local, git]}
        pullRemote: {type: string, maxLength: 64, description: Name of the single fetch/pull authority, or an empty string for none}
        remotes:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/StorageRemote'}
          description: Names must be unique under case folding; local storage has no remotes
    StorageUpdate:
      type: object
      additionalProperties: false
      required: [revision, baseRevision, backend, pullRemote, remotes]
      properties:
        revision: {$ref: '#/components/schemas/Revision', description: Expected storage settings revision}
        baseRevision: {$ref: '#/components/schemas/Revision', description: Expected project revision}
        backend: {type: string, enum: [local, git]}
        initialBranch: {type: string, maxLength: 128, default: main, description: Initial branch for local-to-Git enrollment only; at most 128 UTF-8 bytes and a portable valid Git branch name}
        pullRemote: {type: string, maxLength: 64, description: Configured connection name or an empty string for no fetch/pull authority}
        remotes: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/StorageRemote'}}
    StorageResult:
      type: object
      additionalProperties: false
      required: [settings, projectRevision, sync, remotes]
      properties:
        settings: {$ref: '#/components/schemas/StorageSettings'}
        projectRevision: {$ref: '#/components/schemas/Revision'}
        sync: {$ref: '#/components/schemas/StorageSyncStatus'}
        remotes: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/RemoteSyncStatus'}}
    RemoteSyncStatus:
      type: object
      additionalProperties: false
      required: [name, state, retryable]
      properties:
        name: {$ref: '#/components/parameters/StorageRemoteName/schema'}
        branch: {type: string, maxLength: 128}
        head: {type: string, maxLength: 64}
        lastPushedHead: {type: string, maxLength: 64}
        state: {type: string, enum: [unknown, ready, pending, error, disabled]}
        retryable: {type: boolean}
        error: {type: string, maxLength: 1024, description: Safe fixed message; command output and credential material are never returned}
    StorageRemoteCheck:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {$ref: '#/components/schemas/Revision', description: Expected storage settings revision}
    StorageRemotePush:
      type: object
      additionalProperties: false
      required: [revision, baseRevision]
      properties:
        revision: {$ref: '#/components/schemas/Revision', description: Expected storage settings revision}
        baseRevision: {$ref: '#/components/schemas/Revision', description: Expected project revision}
    ThemePalette:
      type: object
      additionalProperties: false
      description: Optional palette overrides; omitted colors use the theme defaults
      properties:
        background: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        surface: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        text: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        muted: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        border: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accent: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    ThemeTokens:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
        name: {type: string, minLength: 1, maxLength: 120, description: At most 120 UTF-8 bytes}
        description: {type: string, maxLength: 512, description: At most 512 UTF-8 bytes}
        mode: {type: string, enum: [auto, light, dark]}
        accent: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        font: {type: string, enum: [system, serif, mono]}
        density: {type: string, enum: [comfortable, compact]}
        width: {type: string, enum: [normal, wide]}
        radius: {type: integer, minimum: 0, maximum: 24}
        light: {$ref: '#/components/schemas/ThemePalette'}
        dark: {$ref: '#/components/schemas/ThemePalette'}
    ThemeInput:
      type: object
      additionalProperties: false
      required: [id, name]
      description: At most 16 KiB of JSON. Omit revision for creation; updating a custom theme requires the current global project revision. Builtin themes are immutable.
      properties:
        id: {$ref: '#/components/schemas/ThemeTokens/properties/id'}
        name: {$ref: '#/components/schemas/ThemeTokens/properties/name'}
        description: {$ref: '#/components/schemas/ThemeTokens/properties/description'}
        mode: {$ref: '#/components/schemas/ThemeTokens/properties/mode'}
        accent: {$ref: '#/components/schemas/ThemeTokens/properties/accent'}
        font: {$ref: '#/components/schemas/ThemeTokens/properties/font'}
        density: {$ref: '#/components/schemas/ThemeTokens/properties/density'}
        width: {$ref: '#/components/schemas/ThemeTokens/properties/width'}
        radius: {$ref: '#/components/schemas/ThemeTokens/properties/radius'}
        light: {$ref: '#/components/schemas/ThemePalette'}
        dark: {$ref: '#/components/schemas/ThemePalette'}
        revision: {type: string, maxLength: 64, pattern: '^(?:[0-9a-f]{64})?$'}
    Theme:
      type: object
      additionalProperties: false
      required: [id, name, builtin]
      properties:
        id: {$ref: '#/components/schemas/ThemeTokens/properties/id'}
        name: {$ref: '#/components/schemas/ThemeTokens/properties/name'}
        description: {$ref: '#/components/schemas/ThemeTokens/properties/description'}
        mode: {$ref: '#/components/schemas/ThemeTokens/properties/mode'}
        accent: {$ref: '#/components/schemas/ThemeTokens/properties/accent'}
        font: {$ref: '#/components/schemas/ThemeTokens/properties/font'}
        density: {$ref: '#/components/schemas/ThemeTokens/properties/density'}
        width: {$ref: '#/components/schemas/ThemeTokens/properties/width'}
        radius: {$ref: '#/components/schemas/ThemeTokens/properties/radius'}
        light: {$ref: '#/components/schemas/ThemePalette'}
        dark: {$ref: '#/components/schemas/ThemePalette'}
        builtin: {type: boolean, readOnly: true}
        revision: {$ref: '#/components/schemas/Revision', readOnly: true}
        sync: {$ref: '#/components/schemas/SyncWarning', readOnly: true}
    SyncWarning:
      type: object
      additionalProperties: false
      description: Requested Git synchronization needs attention after a successful local publication
      required: [backend, state, ahead, behind, dirty, retryable]
      properties:
        backend: {type: string, enum: [local, git]}
        branch: {type: string}
        head: {type: string}
        state: {type: string}
        ahead: {type: integer, minimum: 0}
        behind: {type: integer, minimum: 0}
        dirty: {type: boolean}
        retryable: {type: boolean}
        error: {type: string, maxLength: 1024}
    Settings:
      description: Full settings object, at most 512 KiB JSON. The selected themeId resolves registry tokens. Missing or stale revision returns 409. Sync metadata is response-only and ignored if supplied. The full navigation tree is visible and editable only to administrators with root read and write access. Omitting navigation.tree preserves the stored tree; explicit null resets it.
      type: object
      additionalProperties: false
      required: [revision, title]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        title: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 4096, description: At most 4096 UTF-8 bytes}
        logo: {type: string, maxLength: 4096, description: Declared local raster asset; URLs and SVG are not accepted}
        favicon: {type: string, maxLength: 4096, description: Declared local raster asset; URLs and SVG are not accepted}
        footer: {type: string, maxLength: 1024}
        themeId: {type: string, maxLength: 64}
        theme: {$ref: '#/components/schemas/ThemeTokens'}
        sync: {$ref: '#/components/schemas/SyncWarning', readOnly: true}
        navigation:
          type: object
          additionalProperties: false
          properties:
            showTOC: {type: boolean}
            showPreviousNext: {type: boolean}
            stickyHeader: {type: boolean}
            tree:
              description: Optional custom hierarchy; omitted on updates preserves the existing tree, null resets to legacy flat navigation, and an explicit empty items array stays custom
              oneOf:
                - {$ref: '#/components/schemas/NavigationTree'}
                - {type: 'null'}
        editor:
          type: object
          additionalProperties: false
          properties:
            defaultFormat: {type: string, enum: [markdown, html, protobuf, openapi]}
            previewOnSave: {type: boolean}
        api:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            showCurl: {type: boolean}
            requestTimeoutMs: {type: integer, minimum: 1000, maximum: 30000}
            maxResponseBytes: {type: integer, minimum: 1024, maximum: 1048576}
        publishing:
          type: object
          additionalProperties: false
          properties:
            autoPublish: {type: boolean}
            gitPushOnPublish: {type: boolean, description: Enabling this requires configured Git storage; local storage returns 400}
    NavigationTree:
      type: object
      additionalProperties: false
      required: [items]
      description: At most 256 KiB of encoded JSON, 4096 nodes and eight authored node levels. Referenced published page IDs must exist and appear once. Empty source groups and cycles are rejected. Unreadable pages and empty groups are removed from reader projections with all their metadata.
      properties:
        unlistedPages: {type: string, enum: [append, omit], default: append, description: Append other permitted pages in manifest order, or omit them only from navigation and previous/next; this does not change access or search}
        items: {type: array, maxItems: 4096, items: {$ref: '#/components/schemas/NavigationNode'}}
    NavigationNode:
      oneOf:
        - {$ref: '#/components/schemas/NavigationPage'}
        - {$ref: '#/components/schemas/NavigationGroup'}
    NavigationPage:
      type: object
      additionalProperties: false
      required: [kind, pageId]
      properties:
        kind: {type: string, const: page}
        pageId: {type: string, minLength: 1, maxLength: 128, description: Published stable document ID; its URL is resolved from the manifest}
        title: {type: string, maxLength: 256, description: Optional plain-text navigation label, at most 256 UTF-8 bytes; an empty label uses the page title}
    NavigationGroup:
      type: object
      additionalProperties: false
      required: [kind, id, title, children]
      properties:
        kind: {type: string, const: group}
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: Unique stable group ID}
        title: {type: string, minLength: 1, maxLength: 256, description: Plain-text group label, at most 256 UTF-8 bytes}
        description: {type: string, maxLength: 512, description: Optional plain text, at most 512 UTF-8 bytes}
        collapsed: {type: boolean, default: false, description: Initially collapse the native disclosure; current-page ancestors are opened automatically}
        children: {type: array, minItems: 1, maxItems: 4096, items: {$ref: '#/components/schemas/NavigationNode'}}
    Diagnostic:
      type: object
      required: [message]
      properties:
        file: {type: string, maxLength: 2048}
        line: {type: integer, minimum: 0}
        column: {type: integer, minimum: 0}
        severity: {type: string, enum: [error, warning, info]}
        code: {type: string, maxLength: 128}
        message: {type: string, maxLength: 4096}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            currentRevision: {type: string}
            diagnostics: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Diagnostic'}}
            draft: {$ref: '#/components/schemas/Draft'}
            document: {$ref: '#/components/schemas/Document'}
  responses:
    Failure:
      description: JSON error for unsupported methods or media, request limits, busy workspace, timeout or server failure; saved draft metadata is included after an unsuccessful publication when available
      headers:
        Retry-After: {schema: {type: string}}
        Allow: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Invalid or unsupported request; no mutation occurred
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, expired or invalid session; invalid credentials are not distinguished
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Insufficient permission or failed origin/CSRF validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Missing:
      description: Requested resource does not exist
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Stale revision, conflicting change, unsafe branch switch or final-administrator invariant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Request exceeds the documented byte or resource limit
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Limited:
      description: Login rate or concurrent password-verification limit reached
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidContent:
      description: Source failed validation; draft retained and previous successful publication preserved
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SyncFailed:
      description: Remote synchronization failed; local source, draft and commits are preserved
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
